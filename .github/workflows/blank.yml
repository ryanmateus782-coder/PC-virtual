name: Git Ranger Windows Runner

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Preparar pasta de trabalho
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE "GitRanger"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          @"
          Git Ranger - Windows Runner
          Criado em: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Sistema: Windows
          "@ | Set-Content (Join-Path $work "status.txt")
          "Arquivo de teste criado com sucesso." |
            Set-Content (Join-Path $work "teste.txt")

      - name: Verificar Windows, RAM e disco
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List

          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object -First 1 Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-List

          Write-Host "=== RAM ==="
          $os = Get-CimInstance Win32_OperatingSystem
          "RAM total: {0:N2} GB" -f ($os.TotalVisibleMemorySize / 1MB)

          Write-Host "=== DISCOS ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{Name="Total_GB";Expression={[math]::Round($_.Size / 1GB, 2)}},
              @{Name="Livre_GB";Expression={[math]::Round($_.FreeSpace / 1GB, 2)}} |
            Format-Table -AutoSize

      - name: Empacotar arquivos de saída
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE "GitRanger"
          Compress-Archive -Path "$work\*" `
            -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "GitRanger-output.zip") `
            -Force

      - name: Disponibilizar resultado para baixar
        uses: actions/upload-artifact@v4
        with:
          name: GitRanger-Windows-output
          path: GitRanger-output.zip
          if-no-files-found: error
          retention-days: 1
          
